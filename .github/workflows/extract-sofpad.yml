name: Extract Sofpad source archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-sofpad.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f Sofpad_All_Source_Files.zip
          python3 - <<'PY'
          import pathlib
          import zipfile

          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(root / "Sofpad_All_Source_Files.zip") as archive:
              for item in archive.infolist():
                  target = (root / item.filename).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError(f"Unsafe archive path: {item.filename}")
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(item) as src, target.open("wb") as dst:
                      import shutil
                      shutil.copyfileobj(src, dst)
          PY
      - name: Commit extracted source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- ':!Sofpad_All_Source_Files.zip'
          if git diff --cached --quiet; then
            echo "Source files already present."
          else
            git commit -m "Extract complete Sofpad source archive"
            git push origin HEAD:main
          fi
